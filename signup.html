<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign-up page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/signup.css">
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<body>
    <div class="main-container">
        <div class="signup-card">
    <h1>CREATE ACCOUNT</h1>
    <p id="signupMessage" style="display:none;"></p>
    <form id="signupForm">
        <div class="input-group">
        <input type="text" id="name" placeholder="Your Name" required>
        </div>
        <div class="input-group">
        <input type="email" id="email" placeholder="Your Email" required>
        </div>
        <div class="input-group">
        <input type="password" id="password" placeholder="Password" required>
        </div>
        <div class="input-group">
        <input type="password" id="confirmPassword" placeholder="Repeat your password" required>
        </div>
        <div class="input-group">
        <input type="checkbox" id="terms" required>
        <label for="terms">I agree all statements in <a href="#">Terms of service</a> </label>
        </div>
        <button type="submit">SIGN UP</button>
    </form>
    <p>Have already an account?<a href="login.html">Login here</a></p>
    </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
